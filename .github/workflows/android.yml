name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npx expo prebuild --platform android --clean --no-install
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone APK (release bundle, debug test signing)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Enable KVM for native smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch actual APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          working-directory: android
          script: ../tests/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screen-evidence
          path: native-evidence/*
          retention-days: 7
      - name: Name APK and checksum
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/waymark-1.0.0-debug.apk
          cd release && sha256sum waymark-1.0.0-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: waymark-debug-apk
          path: release/*
          retention-days: 14
      - name: Attach APK to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
      - name: Publish narrow completion record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          printf '{"sha":"%s","status":"%s","url":"%s/%s/actions/runs/%s"}\n' "$GITHUB_SHA" "$RESULT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-status.json
          old_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/build-status.json?ref=ci-status" --jq .sha 2>/dev/null || true)
          if [ -z "$old_sha" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/ci-status -f sha="$GITHUB_SHA" >/dev/null
          fi
          encoded=$(base64 -w0 build-status.json)
          if [ -n "$old_sha" ]; then
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build-status.json" -f message="Record Android build outcome" -f content="$encoded" -f branch=ci-status -f sha="$old_sha" >/dev/null
          else
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build-status.json" -f message="Record Android build outcome" -f content="$encoded" -f branch=ci-status >/dev/null
          fi
