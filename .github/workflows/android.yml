name: Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npx expo prebuild --platform android --clean --no-install
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone APK (release bundle, debug test signing)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Name APK and checksum
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk release/waymark-1.0.0-debug.apk
          cd release && sha256sum waymark-1.0.0-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: waymark-debug-apk
          path: release/*
          retention-days: 14
      - name: Attach APK to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md --verify-tag
