name: Android APK
on:
  push:
    branches: [main]
    # Workflow-only edits don't need a build. Path filters are ignored for tag pushes.
    paths-ignore: ['.github/workflows/android.yml']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      reuse_run_id:
        description: Existing run containing waymark-debug-apk (skip rebuilding)
        required: false
        type: string
      release_tag:
        description: Existing release tag to attach the APK to (e.g. v1.2.0)
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ inputs.reuse_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npx expo prebuild --platform android --clean --no-install
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone APK (release bundle, debug test signing)
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Name APK and checksum
        run: |
          mkdir -p release
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="${GITHUB_SHA::7}"; fi
          APK="waymark-${VERSION}-debug.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release/$APK"
          cd release && sha256sum "$APK" > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: waymark-debug-apk
          path: release/*
          retention-days: 14
      - name: Publish narrow completion record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          if [ "$RESULT" = success ]; then RESULT=pending-smoke; fi
          printf '{"sha":"%s","status":"%s","url":"%s/%s/actions/runs/%s"}\n' "$GITHUB_SHA" "$RESULT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-status.json
          # Keep error response bodies out of old_sha: gh may print JSON on failure.
          old_sha=""
          if gh api "repos/$GITHUB_REPOSITORY/contents/build-status.json?ref=ci-status" > /tmp/previous-status.json 2>/dev/null; then
            old_sha=$(jq -r '.sha // empty' /tmp/previous-status.json)
          fi
          if ! gh api --silent "repos/$GITHUB_REPOSITORY/git/ref/heads/ci-status" 2>/dev/null; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/ci-status -f sha="$GITHUB_SHA" >/dev/null
          fi
          encoded=$(base64 -w0 build-status.json)
          args=(--method PUT "repos/$GITHUB_REPOSITORY/contents/build-status.json" -f message="Record Android build outcome" -f content="$encoded" -f branch=ci-status)
          if [ -n "$old_sha" ]; then args+=(-f sha="$old_sha"); fi
          gh api "${args[@]}" >/dev/null
  smoke:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != '')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - name: Reserve emulator disk space
        run: |
          # This clean test runner needs no compilers, Gradle cache or Android NDK.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
          available=$(df -Pk / | awk 'NR==2 {print $4}')
          test "$available" -ge 12582912 || { echo 'Need at least 12 GiB free before emulator install'; exit 1; }
      - uses: actions/download-artifact@v5
        with:
          name: waymark-debug-apk
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
      - name: Verify APK checksum
        run: |
          cd release && sha256sum -c SHA256SUMS.txt
          cd ..
          mkdir -p android/app/build/outputs/apk/release
          cp release/waymark-*-debug.apk android/app/build/outputs/apk/release/app-release.apk
      - name: Enable KVM for native smoke test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch actual APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          ram-size: 2048M
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim -camera-back none
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          working-directory: android
          script: ../tests/android-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-screen-evidence
          path: native-evidence/*
          retention-days: 7
      - name: Publish combined completion record
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          printf '{"sha":"%s","status":"%s","url":"%s/%s/actions/runs/%s"}\n' "$GITHUB_SHA" "$RESULT" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-status.json
          old_sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/build-status.json?ref=ci-status" --jq .sha)
          encoded=$(base64 -w0 build-status.json)
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/build-status.json" -f message="Record Android smoke outcome" -f content="$encoded" -f branch=ci-status -f sha="$old_sha" >/dev/null
  release:
    # Attach the built APK to the GitHub Release for a tag (or a chosen existing tag via workflow_dispatch).
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.reuse_run_id != '')) && (github.ref_type == 'tag' || inputs.release_tag != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: waymark-debug-apk
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.reuse_run_id || github.run_id }}
      - name: Upload APK to the release
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release/*.apk release/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
